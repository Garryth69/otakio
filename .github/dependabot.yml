version: 2
updates:
  # GitHub Actions are pinned to commit SHAs; Dependabot proposes the updates as pull requests
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
  # Python packages of the tools and robots (tools/requirements.txt): CI runs every test with the new version first
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
