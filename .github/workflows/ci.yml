name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the extension catalog lives in its own repository; the simulator bundles it like a test VPK
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Garryth69/otakio-extensions
          path: repo

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install lupa pillow

      - name: Extension catalog (hashes, ids, Lua compiles)
        run: python tools/validate_repo.py --git

      - name: Bundle the catalog for the simulator
        run: |
          python - <<'PY'
          import shutil
          shutil.copytree("repo", "source/repo", dirs_exist_ok=True,
                          ignore=shutil.ignore_patterns("native", "health.json", "removed.json", ".git", ".github", "*.md", "LICENSE"))
          PY

      - name: Lua syntax
        run: python tools/check_syntax.py

      - name: Core tests (JSON, HTML, serialization)
        run: python tools/run_lua.py tools/tests/test_core.lua tools/tests/test_diag.lua tools/tests/test_browselang.lua

      - name: Data migrations
        run: python tools/tests/test_migrations.py

      - name: Translations
        run: python tools/check_lang.py

      - name: Simulated Vita (offline scenarios)
        run: |
          for s in tour extensions settings lang about extlang opensrc idleclock dlviews downloads themepick alltabs                    importempty browselang readerselect; do
            echo "::group::$s"
            python tools/tests/sim.py "$s"
            echo "::endgroup::"
          done
          echo "::group::setup"
          python tools/tests/sim.py setup --setup
          python tools/tests/sim.py setupoffline --setup
          echo "::endgroup::"
          echo "::group::libscroll (400 covers)"
          python tools/tests/sim.py libscroll --seed-library 400
          echo "::endgroup::"

      - name: Simulated Vita (import, reader, save image)
        run: |
          T="$RUNNER_TEMP/sim-import"
          python tools/tests/make_import_fixtures.py "$T"
          for s in import importread readercolors saveimage savepng; do
            echo "::group::$s"
            python tools/tests/sim.py "$s" --tmp "$T" --keep
            echo "::endgroup::"
          done
          # the imported titles reached the library and "Save image" wrote a file
          test -s "$T/ux0/data/otakio/save.dat"
          ls "$T/ux0/data/otakio/pictures/" | grep -q .

      - name: Release VPK builds
        run: python tools/build_vpk.py --name Otakio-ci.vpk
