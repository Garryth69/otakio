name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the extension catalog lives in its own repository; the simulator bundles it like a test VPK
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Garryth69/otakio-extensions
          path: repo

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Extension catalog (hashes, ids, Lua compiles)
        run: python tools/validate_repo.py --git

      - name: Bundle the catalog for the simulator
        run: |
          python - <<'PY'
          import shutil
          shutil.copytree("repo", "source/repo", dirs_exist_ok=True,
                          ignore=shutil.ignore_patterns("native", "health.json", "removed.json", ".git", ".github", "*.md", "LICENSE"))
          PY

      - name: Lua syntax
        run: python tools/check_syntax.py

      - name: Core tests (JSON, HTML, serialization)
        run: python tools/run_lua.py tools/tests/test_core.lua tools/tests/test_diag.lua tools/tests/test_browselang.lua tools/tests/test_sourceprefs.lua tools/tests/test_remoteconfig.lua tools/tests/test_proxy_switch.lua

      - name: Data migrations and source health history
        run: |
          python tools/tests/test_migrations.py
          python tools/tests/test_health_merge.py
          python tools/tests/test_domain_move.py
          python tools/tests/test_madara_fallback.py
          python tools/tests/test_system_sandbox.py
          python tools/tests/test_prune_limits.py
          python tools/tests/test_update_sources.py

      - name: Unattended maintenance in the simulator (remote settings, replaced extensions)
        run: |
          python tools/tests/test_sim_maintenance.py
          python tools/tests/test_sim_patches.py
          python tools/tests/test_sim_backup.py
          python tools/tests/test_sim_details.py

      - name: Translations
        run: python tools/check_lang.py

      - name: Simulated Vita (offline scenarios)
        run: |
          for s in tour extensions settings lang about extlang opensrc idleclock dlviews downloads themepick alltabs                    importempty browselang readerselect settingstree autobackup hinttap; do
            echo "::group::$s"
            python tools/tests/sim.py "$s"
            echo "::endgroup::"
          done
          echo "::group::setup"
          python tools/tests/sim.py setup --setup
          python tools/tests/sim.py setupoffline --setup
          echo "::endgroup::"
          echo "::group::libscroll (400 covers)"
          python tools/tests/sim.py libscroll --seed-library 400
          echo "::endgroup::"

      - name: Simulated Vita (import, reader, save image)
        run: |
          T="$RUNNER_TEMP/sim-import"
          python tools/tests/make_import_fixtures.py "$T"
          for s in import importread readercolors saveimage savepng; do
            echo "::group::$s"
            python tools/tests/sim.py "$s" --tmp "$T" --keep
            echo "::endgroup::"
          done
          # webtoon mode: the page buttons jump a page at a time (default)
          python tools/tests/sim.py webtoonlr --tmp "$T" --keep --set 'ReaderDirection = "WEBTOON"'
          # the imported titles reached the library and "Save image" wrote a file
          test -s "$T/ux0/data/otakio/save.dat"
          ls "$T/ux0/data/otakio/pictures/" | grep -q .

      - name: Release VPK builds
        run: python tools/build_vpk.py --name Otakio-ci.vpk

  # Dependabot's updates merge themselves once the job above passes, major versions included: GitHub retires old
  # action runtimes, and an update left waiting for a person would stop the workflows while nobody maintains them
  automerge:
    needs: test
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - run: gh pr merge "$PR" --squash --delete-branch --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
